<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Upload File</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c10;--border:rgba(255,255,255,.05);
  --text:#e8edf2;--muted:rgba(232,237,242,.35);
  --accent:#ff8c00;--surface:rgba(13,19,24,.9);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;overflow:hidden}

body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(var(--border) 1px,transparent 1px),
    linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 90% 90% at 50% 50%,black 20%,transparent 100%);
  pointer-events:none;
}
body::after{
  content:'';position:fixed;
  width:600px;height:600px;
  top:50%;left:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,140,0,.06) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}

.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* top bar */
.bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 2rem;border-bottom:1px solid var(--border);flex-shrink:0;
}
.bar-left{display:flex;align-items:center;gap:.8rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,140,0,.4)}50%{opacity:.7;box-shadow:0 0 0 5px rgba(255,140,0,0)}}
.bar-label{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--accent);letter-spacing:.14em}
.bar-right{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);letter-spacing:.1em}
.back{
  font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);
  letter-spacing:.1em;text-decoration:none;
  display:flex;align-items:center;gap:.4rem;
  transition:color .2s;
}
.back:hover{color:var(--text)}

/* main */
main{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:2rem;position:relative;
}

/* card */
.card{
  width:100%;max-width:460px;
  background:var(--surface);
  border:1px solid var(--border);
  border-top:2px solid var(--accent);
  border-radius:4px;
  backdrop-filter:blur(16px);
  animation:fadeup .5s ease both;
}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.card-header{
  padding:1.6rem 2rem 1.2rem;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.card-title-wrap{}
.tag{
  display:inline-flex;align-items:center;gap:.4rem;
  font-family:'DM Mono',monospace;font-size:.64rem;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);margin-bottom:.5rem;
}
.tag::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--accent)}
.card-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:2rem;letter-spacing:.06em;color:var(--text);
}
.method-badge{
  font-family:'DM Mono',monospace;font-size:.66rem;
  letter-spacing:.14em;color:var(--accent);
  border:1px solid rgba(255,140,0,.25);
  padding:.25rem .6rem;border-radius:2px;
  align-self:flex-start;margin-top:.2rem;
}

/* form body */
.card-body{padding:1.8rem 2rem}

.field{margin-bottom:1.2rem}
.field-label{
  display:block;
  font-family:'DM Mono',monospace;font-size:.66rem;
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin-bottom:.6rem;
}

/* file rows */
.file-row{
  display:flex;align-items:center;gap:.8rem;
  padding:.75rem 1rem;
  background:rgba(255,255,255,.02);
  border:1px solid var(--border);
  border-radius:2px;
  margin-bottom:.5rem;
  cursor:pointer;
  transition:border-color .2s,background .2s;
  position:relative;overflow:hidden;
}
.file-row:hover{border-color:rgba(255,140,0,.3);background:rgba(255,140,0,.03)}
.file-row input[type="file"]{
  position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;
}
.file-icon{
  font-size:1rem;flex-shrink:0;
  width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,140,0,.08);border-radius:2px;
}
.file-text{
  font-family:'DM Mono',monospace;font-size:.72rem;
  color:var(--muted);letter-spacing:.06em;flex:1;
  pointer-events:none;
}
.file-num{
  font-family:'DM Mono',monospace;font-size:.62rem;
  color:rgba(255,140,0,.4);letter-spacing:.1em;
  pointer-events:none;
}

/* submit */
.btn{
  width:100%;padding:.85rem;margin-top:.4rem;
  background:var(--accent);color:#fff;border:none;
  font-family:'DM Mono',monospace;font-size:.78rem;
  letter-spacing:.16em;text-transform:uppercase;
  cursor:pointer;border-radius:2px;
  display:flex;align-items:center;justify-content:center;gap:.6rem;
  transition:opacity .2s,transform .2s;
}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}

/* bottom bar */
.bottombar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.8rem 2rem;border-top:1px solid var(--border);
  font-family:'DM Mono',monospace;font-size:.66rem;color:var(--muted);letter-spacing:.1em;
  flex-shrink:0;
}
.status-row{display:flex;align-items:center;gap:1.5rem}
.status-item{display:flex;align-items:center;gap:.4rem}
.sdot{width:6px;height:6px;border-radius:50%}
.s-ok{background:#00e5a0}
</style>
</head>
<body>
<div class="page">

  <!-- TOP BAR -->
  <div class="bar">
    <div class="bar-left">
      <div class="dot"></div>
      <span class="bar-label">POST /uploads/</span>
    </div>
    <div style="display:flex;align-items:center;gap:2rem">
      <a href="index.html" class="back">← Dashboard</a>
      <div class="bar-right" id="ts"></div>
    </div>
  </div>

  <!-- MAIN -->
  <main>
    <div class="card">

      <div class="card-header">
        <div class="card-title-wrap">
          <div class="tag">File Transfer</div>
          <div class="card-title">Upload Files</div>
        </div>
        <div class="method-badge">multipart/form-data</div>
      </div>

      <div class="card-body">
        <form action="/uploads/" method="POST" enctype="multipart/form-data">

          <div class="field">
            <label class="field-label">Select files — up to 3</label>

            <div class="file-row" id="row1">
              <div class="file-icon">📄</div>
              <span class="file-text" id="label1">Choose file…</span>
              <span class="file-num">01</span>
              <input type="file" name="file" onchange="update(this,'label1')"/>
            </div>

            <div class="file-row" id="row2">
              <div class="file-icon">📄</div>
              <span class="file-text" id="label2">Choose file…</span>
              <span class="file-num">02</span>
              <input type="file" name="file" onchange="update(this,'label2')"/>
            </div>

            <div class="file-row" id="row3">
              <div class="file-icon">📄</div>
              <span class="file-text" id="label3">Choose file…</span>
              <span class="file-num">03</span>
              <input type="file" name="file" onchange="update(this,'label3')"/>
            </div>
          </div>

          <button type="submit" class="btn">
            ↑ Send Data
          </button>

        </form>
      </div>
    </div>
  </main>

  <!-- BOTTOM BAR -->
  <div class="bottombar">
    <div class="status-row">
      <div class="status-item"><div class="sdot s-ok"></div>Server Ready</div>
    </div>
    <span id="host"></span>
  </div>

</div>
<script>
  function update(input, labelId) {
    const el = document.getElementById(labelId);
    el.textContent = input.files[0] ? input.files[0].name : 'Choose file…';
    el.style.color = input.files[0] ? 'var(--text)' : 'var(--muted)';
  }
  const pad = n => String(n).padStart(2,'0');
  const tick = () => {
    const d = new Date();
    document.getElementById('ts').textContent =
      `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}  ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  };
  tick(); setInterval(tick,1000);
  document.getElementById('host').textContent = window.location.hostname || 'localhost';
</script>
</body>
</html>
