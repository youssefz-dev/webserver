<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Post — Testing Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c10;--border:rgba(255,255,255,.05);
  --text:#e8edf2;--muted:rgba(232,237,242,.35);
  --accent:#3d8eff;--surface:rgba(13,19,24,.9);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;overflow:hidden}

body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(var(--border) 1px,transparent 1px),
    linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 90% 90% at 50% 50%,black 20%,transparent 100%);
  pointer-events:none;
}
body::after{
  content:'';position:fixed;
  width:600px;height:600px;
  top:50%;left:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(61,142,255,.06) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}

.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* top bar */
.bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 2rem;border-bottom:1px solid var(--border);flex-shrink:0;
}
.bar-left{display:flex;align-items:center;gap:.8rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(61,142,255,.4)}50%{opacity:.7;box-shadow:0 0 0 5px rgba(61,142,255,0)}}
.bar-label{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--accent);letter-spacing:.14em}
.bar-right{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);letter-spacing:.1em}
.back{
  font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);
  letter-spacing:.1em;text-decoration:none;
  transition:color .2s;
}
.back:hover{color:var(--text)}

/* main */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem;position:relative}

/* card */
.card{
  width:100%;max-width:460px;
  background:var(--surface);
  border:1px solid var(--border);
  border-top:2px solid var(--accent);
  border-radius:4px;
  backdrop-filter:blur(16px);
  animation:fadeup .5s ease both;
}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.card-header{
  padding:1.6rem 2rem 1.2rem;
  border-bottom:1px solid var(--border);
  display:flex;align-items:flex-start;justify-content:space-between;
}
.tag{
  display:inline-flex;align-items:center;gap:.4rem;
  font-family:'DM Mono',monospace;font-size:.64rem;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);margin-bottom:.5rem;
}
.tag::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--accent)}
.card-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:2rem;letter-spacing:.06em;color:var(--text);
}
.method-badge{
  font-family:'DM Mono',monospace;font-size:.66rem;
  letter-spacing:.14em;color:var(--accent);
  border:1px solid rgba(61,142,255,.25);
  padding:.25rem .6rem;border-radius:2px;margin-top:.2rem;
}

/* form */
.card-body{padding:1.8rem 2rem}

.field{margin-bottom:1rem;position:relative}
.field-label{
  display:block;
  font-family:'DM Mono',monospace;font-size:.64rem;
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin-bottom:.45rem;
}

.field input,
.field textarea{
  width:100%;
  padding:.75rem 1rem;
  background:rgba(255,255,255,.02);
  border:1px solid var(--border);
  border-radius:2px;
  color:var(--text);
  font-family:'DM Mono',monospace;font-size:.8rem;
  letter-spacing:.04em;
  outline:none;
  transition:border-color .2s,background .2s;
  -webkit-appearance:none;
}
.field input::placeholder,
.field textarea::placeholder{color:rgba(232,237,242,.2)}
.field input:focus,
.field textarea:focus{
  border-color:rgba(61,142,255,.4);
  background:rgba(61,142,255,.03);
}

.field textarea{
  resize:none;height:90px;line-height:1.6;
}

/* char counter */
.field-meta{
  display:flex;justify-content:flex-end;
  margin-top:.3rem;
  font-family:'DM Mono',monospace;font-size:.6rem;
  color:rgba(232,237,242,.2);letter-spacing:.08em;
}

/* submit */
.btn{
  width:100%;padding:.85rem;margin-top:.6rem;
  background:var(--accent);color:#fff;border:none;
  font-family:'DM Mono',monospace;font-size:.78rem;
  letter-spacing:.16em;text-transform:uppercase;
  cursor:pointer;border-radius:2px;
  display:flex;align-items:center;justify-content:center;gap:.6rem;
  transition:opacity .2s,transform .2s;
}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}

/* bottom bar */
.bottombar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.8rem 2rem;border-top:1px solid var(--border);
  font-family:'DM Mono',monospace;font-size:.66rem;color:var(--muted);letter-spacing:.1em;
  flex-shrink:0;
}
.status-row{display:flex;align-items:center;gap:1.5rem}
.status-item{display:flex;align-items:center;gap:.4rem}
.sdot{width:6px;height:6px;border-radius:50%}
.s-ok{background:#00e5a0}
</style>
</head>
<body>
<div class="page">

  <div class="bar">
    <div class="bar-left">
      <div class="dot"></div>
      <span class="bar-label">POST /</span>
    </div>
    <div style="display:flex;align-items:center;gap:2rem">
      <a href="index.html" class="back">← Dashboard</a>
      <div class="bar-right" id="ts"></div>
    </div>
  </div>

  <main>
    <div class="card">

      <div class="card-header">
        <div>
          <div class="tag">HTTP Request</div>
          <div class="card-title">Post Data</div>
        </div>
        <div class="method-badge">POST</div>
      </div>

      <div class="card-body">
        <form action="/" method="POST" enctype="multipart/form-data">

          <div class="field">
            <label class="field-label">Username</label>
            <input type="text" name="username" placeholder="e.g. john_doe"/>
          </div>

          <div class="field">
            <label class="field-label">Email</label>
            <input type="email" name="email" placeholder="e.g. john@example.com"/>
          </div>

          <div class="field">
            <label class="field-label">Message</label>
            <textarea name="message" placeholder="Write your message…" id="msg" oninput="count()"></textarea>
            <div class="field-meta"><span id="cnt">0</span>&nbsp;chars</div>
          </div>

          <button type="submit" class="btn">↑ Send Data</button>

        </form>
      </div>
    </div>
  </main>

  <div class="bottombar">
    <div class="status-row">
      <div class="status-item"><div class="sdot s-ok"></div>Server Ready</div>
    </div>
    <span id="host"></span>
  </div>

</div>
<script>
  function count(){
    document.getElementById('cnt').textContent = document.getElementById('msg').value.length;
  }
  const pad = n => String(n).padStart(2,'0');
  const tick = () => {
    const d = new Date();
    document.getElementById('ts').textContent =
      `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}  ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  };
  tick(); setInterval(tick,1000);
  document.getElementById('host').textContent = window.location.hostname || 'localhost';
</script>
</body>
</html>
