<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cookie Tester — Testing Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c10;--border:rgba(255,255,255,.05);
  --text:#e8edf2;--muted:rgba(232,237,242,.35);
  --accent:#a855f7;--surface:rgba(13,19,24,.9);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;overflow:hidden}

body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(var(--border) 1px,transparent 1px),
    linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 90% 90% at 50% 50%,black 20%,transparent 100%);
  pointer-events:none;
}
body::after{
  content:'';position:fixed;width:600px;height:600px;
  top:50%;left:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(168,85,247,.06) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}

.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

.bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 2rem;border-bottom:1px solid var(--border);flex-shrink:0;
}
.bar-left{display:flex;align-items:center;gap:.8rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(168,85,247,.4)}50%{opacity:.7;box-shadow:0 0 0 5px rgba(168,85,247,0)}}
.bar-label{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--accent);letter-spacing:.14em}
.bar-right{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);letter-spacing:.1em}
.back{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);letter-spacing:.1em;text-decoration:none;transition:color .2s}
.back:hover{color:var(--text)}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem;position:relative}

.card{
  width:100%;max-width:500px;
  background:var(--surface);
  border:1px solid var(--border);
  border-top:2px solid var(--accent);
  border-radius:4px;
  backdrop-filter:blur(16px);
  animation:fadeup .5s ease both;
}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.card-header{
  padding:1.6rem 2rem 1.2rem;
  border-bottom:1px solid var(--border);
  display:flex;align-items:flex-start;justify-content:space-between;
}
.tag{
  display:inline-flex;align-items:center;gap:.4rem;
  font-family:'DM Mono',monospace;font-size:.64rem;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);margin-bottom:.5rem;
}
.tag::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--accent)}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:.06em;color:var(--text)}
.method-badge{
  font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.14em;
  color:var(--accent);border:1px solid rgba(168,85,247,.25);
  padding:.25rem .6rem;border-radius:2px;margin-top:.2rem;
}

.card-body{padding:1.6rem 2rem}

/* cookie inspector */
.section-label{
  font-family:'DM Mono',monospace;font-size:.64rem;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  margin-bottom:.6rem;display:block;
}

.cookie-list{
  border:1px solid var(--border);border-radius:2px;
  overflow:hidden;margin-bottom:1.2rem;min-height:56px;
}
.cookie-row{
  display:flex;align-items:center;gap:0;
  border-bottom:1px solid var(--border);
}
.cookie-row:last-child{border-bottom:none}
.cookie-key{
  font-family:'DM Mono',monospace;font-size:.72rem;color:var(--accent);
  letter-spacing:.06em;padding:.55rem .9rem;
  background:rgba(168,85,247,.04);border-right:1px solid var(--border);
  min-width:100px;flex-shrink:0;
}
.cookie-val{
  font-family:'DM Mono',monospace;font-size:.72rem;color:var(--text);
  letter-spacing:.04em;padding:.55rem .9rem;flex:1;word-break:break-all;
}
.cookie-del{
  padding:.55rem .8rem;cursor:pointer;color:rgba(255,60,60,.4);
  font-size:.8rem;border-left:1px solid var(--border);
  transition:color .2s,background .2s;flex-shrink:0;
}
.cookie-del:hover{color:#ff3c3c;background:rgba(255,60,60,.05)}
.cookie-empty{
  font-family:'DM Mono',monospace;font-size:.7rem;
  color:rgba(232,237,242,.15);letter-spacing:.08em;
  padding:.7rem .9rem;
}

/* add cookie row */
.add-row{
  display:flex;gap:.5rem;margin-bottom:1.2rem;
}
.add-row input{
  flex:1;padding:.6rem .9rem;
  background:rgba(255,255,255,.02);border:1px solid var(--border);
  border-radius:2px;color:var(--text);
  font-family:'DM Mono',monospace;font-size:.76rem;letter-spacing:.04em;
  outline:none;transition:border-color .2s;
}
.add-row input:focus{border-color:rgba(168,85,247,.35)}
.add-row input::placeholder{color:rgba(232,237,242,.2)}
.btn-add{
  padding:.6rem 1.1rem;
  background:rgba(168,85,247,.12);color:var(--accent);
  border:1px solid rgba(168,85,247,.25);border-radius:2px;
  font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.12em;
  cursor:pointer;white-space:nowrap;transition:background .2s;
}
.btn-add:hover{background:rgba(168,85,247,.2)}

/* divider */
.divider{height:1px;background:var(--border);margin:1.2rem 0}

/* action buttons */
.actions{display:flex;gap:.6rem}
.btn{
  flex:1;padding:.8rem;
  border:none;border-radius:2px;
  font-family:'DM Mono',monospace;font-size:.74rem;
  letter-spacing:.14em;text-transform:uppercase;
  cursor:pointer;transition:opacity .2s,transform .2s;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{
  background:transparent;color:var(--muted);
  border:1px solid var(--border);
}
.btn-ghost:hover{border-color:rgba(255,255,255,.15);color:var(--text)}
.btn-danger{
  background:rgba(255,60,60,.08);color:#ff3c3c;
  border:1px solid rgba(255,60,60,.2);
}
.btn-danger:hover{background:rgba(255,60,60,.14)}

.bottombar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.8rem 2rem;border-top:1px solid var(--border);
  font-family:'DM Mono',monospace;font-size:.66rem;color:var(--muted);letter-spacing:.1em;
  flex-shrink:0;
}
.status-row{display:flex;align-items:center;gap:1.5rem}
.status-item{display:flex;align-items:center;gap:.4rem}
.sdot{width:6px;height:6px;border-radius:50%}
.s-ok{background:#00e5a0}.s-warn{background:var(--accent)}
</style>

<script>
function getCookie(name){
  for(let c of document.cookie.split(';')){
    const [k,v] = c.trim().split('=');
    if(k===name) return decodeURIComponent(v||'');
  }
  return null;
}

function getAllCookies(){
  if(!document.cookie.trim()) return {};
  return Object.fromEntries(
    document.cookie.split(';').map(c=>{
      const i = c.indexOf('=');
      return [c.slice(0,i).trim(), decodeURIComponent(c.slice(i+1).trim())];
    })
  );
}

function renderCookies(){
  const list = document.getElementById('cookie-list');
  const all = getAllCookies();
  const keys = Object.keys(all);
  const counter = document.getElementById('cookie-count');
  counter.textContent = `${keys.length} cookie${keys.length!==1?'s':''}`;

  if(!keys.length){
    list.innerHTML = '<div class="cookie-empty">No cookies set</div>';
    return;
  }
  list.innerHTML = keys.map(k=>`
    <div class="cookie-row">
      <div class="cookie-key">${escape(k)}</div>
      <div class="cookie-val">${escape(all[k])||'<span style="opacity:.3">(empty)</span>'}</div>
      <div class="cookie-del" onclick="deleteCookie('${k}')" title="Delete">✕</div>
    </div>`).join('');
}

function escape(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function addCookie(){
  const k = document.getElementById('ck-key').value.trim();
  const v = document.getElementById('ck-val').value.trim();
  if(!k) return;
  document.cookie = `${encodeURIComponent(k)}=${encodeURIComponent(v)}; path=/`;
  document.getElementById('ck-key').value='';
  document.getElementById('ck-val').value='';
  renderCookies();
}

function deleteCookie(name){
  document.cookie = `${name}=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT`;
  renderCookies();
}

function clearAll(){
  const all = getAllCookies();
  Object.keys(all).forEach(k=>deleteCookie(k));
  renderCookies();
}

function login(){
  document.cookie = 'login=1; path=/';
  renderCookies();
  document.getElementById('srv-status').innerHTML = '<div class="sdot s-warn"></div>Cookie set';
}

function goHome(){
  if(getCookie('sid')) window.location='home.html';
  else window.location='home.html';
}
</script>
</head>
<body>
<div class="page">

  <div class="bar">
    <div class="bar-left">
      <div class="dot"></div>
      <span class="bar-label">Cookie Tester</span>
    </div>
    <div style="display:flex;align-items:center;gap:2rem">
      <a href="index.html" class="back">← Dashboard</a>
      <div class="bar-right" id="ts"></div>
    </div>
  </div>

  <main>
    <div class="card">

      <div class="card-header">
        <div>
          <div class="tag">Session / Auth</div>
          <div class="card-title">Cookie Tester</div>
        </div>
        <div class="method-badge">document.cookie</div>
      </div>

      <div class="card-body">

        <!-- Inspector -->
        <span class="section-label">Live Cookie Inspector — <span id="cookie-count">0 cookies</span></span>
        <div class="cookie-list" id="cookie-list"></div>

        <!-- Add -->
        <span class="section-label">Set New Cookie</span>
        <div class="add-row">
          <input id="ck-key" placeholder="key" onkeydown="if(event.key==='Enter')addCookie()"/>
          <input id="ck-val" placeholder="value" onkeydown="if(event.key==='Enter')addCookie()"/>
          <button class="btn-add" onclick="addCookie()">+ Set</button>
        </div>

        <div class="divider"></div>

        <!-- Actions -->
        <div class="actions">
          <button class="btn btn-primary" onclick="login()">🍪 Set login=1</button>
          <button class="btn btn-ghost" onclick="goHome()">→ Go to home.html</button>
          <button class="btn btn-danger" onclick="clearAll()">✕ Clear All</button>
        </div>

      </div>
    </div>
  </main>

  <div class="bottombar">
    <div class="status-row">
      <div class="status-item" id="srv-status"><div class="sdot s-ok"></div>Server Ready</div>
    </div>
    <span id="host"></span>
  </div>

</div>
<script>
  renderCookies();

  const pad = n => String(n).padStart(2,'0');
  const tick = () => {
    const d = new Date();
    document.getElementById('ts').textContent =
      `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}  ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  };
  tick(); setInterval(tick,1000);
  document.getElementById('host').textContent = window.location.hostname || 'localhost';
</script>
</body>
</html>
