<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>400 — Bad Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c10;--border:rgba(255,255,255,.05);
  --text:#e8edf2;--muted:rgba(232,237,242,.35);
  --accent:#f5a623;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif}

body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(var(--border) 1px,transparent 1px),
    linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 90% 90% at 50% 50%,black 20%,transparent 100%);
  pointer-events:none;
}

.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

.bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 2rem;border-bottom:1px solid var(--border);
}
.bar-left{display:flex;align-items:center;gap:.8rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(245,166,35,.4)}50%{opacity:.6;box-shadow:0 0 0 6px rgba(245,166,35,0)}}
.bar-code{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--accent);letter-spacing:.14em}
.bar-right{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);letter-spacing:.1em}

main{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:2rem;position:relative;overflow:hidden;
}

.ghost{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(18rem,40vw,32rem);
  line-height:1;color:transparent;
  -webkit-text-stroke:1px rgba(245,166,35,.08);
  position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);
  pointer-events:none;user-select:none;letter-spacing:-.02em;
  animation:drift 8s ease-in-out infinite;
}
@keyframes drift{0%,100%{transform:translate(-50%,-52%)}50%{transform:translate(-50%,-50%)}}

.content{
  position:relative;z-index:1;max-width:520px;
  animation:fadeup .6s ease both;
}
@keyframes fadeup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.tag{
  display:inline-flex;align-items:center;gap:.5rem;
  font-family:'DM Mono',monospace;font-size:.68rem;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);padding:.3rem .8rem;
  border:1px solid rgba(245,166,35,.25);border-radius:2px;
  margin-bottom:1.6rem;
}
.tag::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent)}

h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(3rem,7vw,5.5rem);
  line-height:.95;letter-spacing:.04em;
  color:var(--text);margin-bottom:1.2rem;
}
h1 em{color:var(--accent);font-style:normal}

.desc{
  font-family:'DM Mono',monospace;font-size:.8rem;
  color:var(--muted);line-height:1.8;
  border-left:2px solid rgba(245,166,35,.2);
  padding-left:1rem;margin-bottom:1.6rem;
}

/* syntax breakdown */
.breakdown{
  display:flex;flex-direction:column;gap:.3rem;
  margin-bottom:2rem;
  background:rgba(255,255,255,.02);
  border:1px solid var(--border);
  border-left:2px solid rgba(245,166,35,.25);
  border-radius:0 2px 2px 0;
  padding:.9rem 1rem;
}
.breakdown-row{
  display:flex;align-items:center;gap:.8rem;
  font-family:'DM Mono',monospace;font-size:.72rem;
  line-height:1.6;
}
.bk-label{color:rgba(245,166,35,.6);min-width:80px;flex-shrink:0}
.bk-val{color:var(--muted)}

.actions{display:flex;gap:1rem;flex-wrap:wrap}

.btn-primary{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.75rem 1.8rem;background:var(--accent);color:#080c10;
  font-family:'DM Mono',monospace;font-size:.76rem;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  text-decoration:none;border:none;cursor:pointer;border-radius:2px;
  transition:opacity .2s,transform .2s;
}
.btn-primary:hover{opacity:.85;transform:translateY(-1px)}

.btn-ghost{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.75rem 1.8rem;background:transparent;color:var(--muted);
  font-family:'DM Mono',monospace;font-size:.76rem;
  letter-spacing:.12em;text-transform:uppercase;
  text-decoration:none;border:1px solid var(--border);cursor:pointer;border-radius:2px;
  transition:border-color .2s,color .2s;
}
.btn-ghost:hover{border-color:rgba(255,255,255,.2);color:var(--text)}

.bottombar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.8rem 2rem;border-top:1px solid var(--border);
  font-family:'DM Mono',monospace;font-size:.66rem;
  color:var(--muted);letter-spacing:.1em;
}
.status-row{display:flex;align-items:center;gap:1.5rem}
.status-item{display:flex;align-items:center;gap:.4rem}
.status-dot{width:6px;height:6px;border-radius:50%}
.ok{background:#00e5a0}.warn{background:var(--accent)}
</style>
</head>
<body>
<div class="page">

  <div class="bar">
    <div class="bar-left">
      <div class="dot"></div>
      <span class="bar-code">HTTP 400</span>
    </div>
    <div class="bar-right" id="ts"></div>
  </div>

  <main>
    <div class="ghost">400</div>
    <div class="content">
      <div class="tag">Error 400</div>
      <h1>Bad<br/><em>Request</em></h1>
      <p class="desc">
        The server could not understand your request due to invalid syntax.<br/>
        Please review the request and try again.
      </p>
      <div class="breakdown">
        <div class="breakdown-row"><span class="bk-label">method</span><span class="bk-val" id="bk-method">—</span></div>
        <div class="breakdown-row"><span class="bk-label">path</span><span class="bk-val" id="bk-path">—</span></div>
        <div class="breakdown-row"><span class="bk-label">protocol</span><span class="bk-val" id="bk-proto">—</span></div>
        <div class="breakdown-row"><span class="bk-label">reason</span><span class="bk-val" style="color:var(--accent)">Malformed or invalid request syntax</span></div>
      </div>
      <div class="actions">
        <a href="/" class="btn-primary">↩ Go Home</a>
        <a href="javascript:history.back()" class="btn-ghost">← Go Back</a>
      </div>
    </div>
  </main>

  <div class="bottombar">
    <div class="status-row">
      <div class="status-item"><div class="status-dot ok"></div>Server Online</div>
      <div class="status-item"><div class="status-dot warn"></div>Invalid Request</div>
    </div>
    <span id="path"></span>
  </div>

</div>
<script>
  const pad = n => String(n).padStart(2,'0');
  const tick = () => {
    const d = new Date();
    document.getElementById('ts').textContent =
      `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}  ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  };
  tick(); setInterval(tick,1000);

  document.getElementById('path').textContent     = window.location.pathname;
  document.getElementById('bk-path').textContent  = window.location.pathname;
  document.getElementById('bk-method').textContent = document.referrer ? 'GET' : '—';
  document.getElementById('bk-proto').textContent  = window.location.protocol.replace(':','').toUpperCase() + '/1.1';
</script>
</body>
</html>
